name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate all packages
        run: |
          fail=0
          for d in packages/*/; do
            echo "::group::$d"
            node scripts/validate-package.mjs "$d" || fail=1
            echo "::endgroup::"
          done
          exit $fail
